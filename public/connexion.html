<form action="/api/auth/login" method="post" novalidate>
    <h1>Connexion</h1>
    <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-help">
        <p id="email-help" class="help">L'email utilisé lors de votre inscription</p>
    </div>
    <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <p class="error" role="alert" hidden>Identifiants Incorrect</p>
        <button type="submit">Se connecter</button>
    </div>
</form>
