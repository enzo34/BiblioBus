<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliobus</title>
    <meta name="description"
        content="Consultez les 300 livres de la bibliothéque BiblioBus et vérifiez leur disponibilité">
    <link rel="stylesheet" href="./css/token.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <form id="formulaire">
        <h1>Connexion</h1>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-help">
            <p id="email-help" class="help">L'email utilisé lors de votre inscription</p>
        </div>
        <div class="field">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <p id="message"></p>
            <button type="submit">Se connecter</button>
        </div>
    </form>

    <script src="js/connexion.js"></script>

</body>
